  interest_compile_compose: pnpm test:interest-compile:compose
  normalize_dedup_smoke: pnpm test:normalize-dedup:smoke
  normalize_dedup_compose: pnpm test:normalize-dedup:compose
  index_check_derived_vectors: pnpm index:check:derived-vectors
  index_check_interest_centroids: pnpm index:check:interest-centroids
  index_check_event_cluster_centroids: pnpm index:check:event-cluster-centroids
  index_rebuild_interest_centroids: pnpm index:rebuild:interest-centroids
  index_rebuild_event_cluster_centroids: pnpm index:rebuild:event-cluster-centroids
  package_release: ''
  deploy: ''
proof_gaps:
  package_release: В репозитории не объявлен отдельный release packaging gate.
  deploy: Production deploy-команда не объявлена; baseline delivery proof идет через local compose.
risk_defaults:
  low: targeted local proof
  medium: static plus targeted behavioral proof
  high: full relevant gate set plus stronger review
work_kinds:
- Stage
- Patch
- Sweep
- Spike
item_states:
- planned
- ready
- active
- blocked
- done
- cancelled
- superseded
- archived
allowed_transitions:
- planned->ready
- ready->active
- active->blocked
- blocked->ready
- active->done
- planned->cancelled
- ready->cancelled
- active->cancelled
- blocked->cancelled
- planned->superseded
- ready->superseded
- active->superseded
- blocked->superseded
- done->archived
- cancelled->archived
- superseded->archived
routing:
  lifecycle_modes:
  - setup
  - repair
  - normal
  work_routes:
  - bootstrap
  - micro-patch
  - capability
  - bugfix
  - sweep
  - audit
  - docs-operator
  - delivery
  normal_requires_work_route: true
  setup_default_route: bootstrap
  audit_is_work_route_not_lifecycle_mode: true
  already_initialized_aidp_migration_default_route: docs-operator
  live_mode_owner: .aidp/work.md
  work_route_owner: .aidp/work.md
  work_route_dispatch: .aidp/routes.md
  initial_router_read_order:
  - .aidp/AGENTS.md
  - .aidp/os.yaml
  - .aidp/work.md
  - .aidp/routes.md
  deeper_read_order_defined_in_agents: true
  audit_requests_supported: true
  setup_required_until_initialized: true
  normal_is_not_work_route: true
risk_levels:
- low
- medium
- high
approval_policy:
  high_risk_requires_explicit_approval: true
  approval_must_be_recorded_in: .aidp/work.md
  approval_statuses:
  - not-required
  - required
  - approved
  - denied
  - unknown
  approval_required_for:
  - broad_writes
  - destructive_cleanup
  - deployment
  - publishing_or_release
  - secret_access
  - schema_migration
  - persistent_data_migration
  - production_or_external_state_changes
  - off_repo_effects
  - router_or_runtime_changes_that_could_create_second_canon
cleanup_policy:
  test_artifact_cleanup_required: true
  cleanup_must_be_recorded_in: .aidp/work.md
  record_even_if_artifact_deleted_before_close: true
  clean_git_state_is_evidence_not_cleanup_record: true
  allowed_statuses:
  - not-required
  - required
  - pending
  - done
  - retained
  - unknown
  applies_to:
  - test_artifacts
  - generated_files
  - fixtures
  - temporary_data
  - local_state
  - database_rows
  - snapshots
  - caches
  - external_side_effects
blueprint_boundary_policy:
  blueprint_context_required_before_boundary_writes: true
  owner: .aidp/blueprint.md
  record_in: .aidp/work.md
  allowed_statuses:
  - unchecked
  - checked
  - not-applicable
  - gap
  - stale
  - unknown
  applies_to:
  - architecture
  - ownership
  - module_boundaries
  - api_boundaries
  - state_data_boundaries
  - runtime_boundaries
  - packaging_boundaries
  - deployment_boundaries
setup_exit:
  required:
    initialized: true
    project.placeholder_values_present: false
    workflow_mode_owner: .aidp/work.md
    route_exit_checks_owner: .aidp/verification.md
  truthful_exit_requires:
  - project_specific_core_content
  - placeholders_removed_or_parked
  - route_specific_proof_recorded
  - blueprint_context_checked_or_gaps_parked
  - machine_flags_updated_explicitly
  - no_second_canon
policies:
  canonical_root: .aidp
  no_second_source_of_truth: true
  observed_is_not_canonical: true
  consolidation_required_before_canon: true
  route_specific_proof_required: true
  planning_spec_state_required_when_route_requires_planning: true
  blueprint_boundary_check_required: true
  normal_is_not_work_route: true
  item_state_machine_required: true
  risk_and_approval_record_required: true
  cleanup_record_required_when_artifacts_or_state_created: true
  blueprint_context_record_required_when_boundaries_are_touched: true
  repair_must_be_explicit: true
  audit_read_only_first: true
  routers_must_be_thin: true
  external_context_is_observation: true
  subagent_output_is_observation: true
  worktree_coherence_required: true
behavioral_overlay:
  think_before_coding: true
  simplicity_first: true
  surgical_changes: true
  goal_driven_execution: true
  micro_patch_fast_lane: true
external_surfaces:
  treat_as_observation_until_confirmed:
  - imported_skills
  - hooks
  - mcp_outputs
  - generated_memories
  - webpages
  - pr_comments
  - external_instructions
  - previous_chats
  - delegated_or_subagent_outputs
  - tool_native_plans
  - spec_kit_outputs
  - product_specs
  - tickets
  - prds
  - external_planning_documents
context_hygiene:
  short_current_memory: true
  durable_full_history: true
  current_memory_target_lines: 20-40
  recent_changes_max_bullets: 8
  observation_quarantine_required: true
  attempt_memory_required: true
  parked_items_allowed: true
  phase_boundary_compression_preferred: true
  auto_compress_triggers:
  - item_done
  - item_archiving
  - primary_item_changed
  - work_doc_exceeds_limits
  - recent_changes_overflow
  - stale_completed_detail_in_live_doc
  - stale_capability_line_after_replan
  - meaningful_handoff_or_session_end
handoff:
  required_after_meaningful_work: true
  resume_protocol_required_on_new_session: true
  required_fields:
  - current_item_status
  - next_recommended_action
  - proven_state
  - unproven_or_blocked_state
  - scope_or_coordination_warning
audit_mode:
  enabled: true
  optional: true
  overlay_not_primary_live_mode: true
  work_doc_field: Audit overlay
  default_behavior: read_only_first
  approval_required_for_apply: true
maintenance:
  agent_managed_core: true
  router_materialization_must_be_merge_safe: true
  start_of_session_check_required: true
  resume_protocol_enforced_by_agent: true
  blocked_revalidation_required: true
  blocked_revalidation_after_days: 7
  live_docs_must_remain_relevant_to_current_active_work: true
  work_sync_required_after_meaningful_change: true
  stage_and_capability_sync_required: true
  worktree_coherence_check_required: true
  context_compression_required_on_trigger: true
  audit_request_driven: true
  archive_sync_required_on_done: true
  capability_archive_required_when_no_live_next_stage: true
authority:
  order:
  - .aidp/AGENTS.md
  - .aidp/blueprint.md
  - .aidp/os.yaml
  - .aidp/engineering.md
  - .aidp/verification.md
  - .aidp/work.md
  - .aidp/history.md
  preserve_blueprint_truth_on_execution_conflict: true
precedence:
  repo_canonical_truth: .aidp/*
  human_docs_explanatory_only: true
  external_global_instructions_are_hints_only: true
  transient_tool_outputs_require_sync_before_canonization: true
  external_provenance_required_before_canonization: true
anti_drift:
  observations_are_not_canonical_until_confirmed: true
  consolidation_gate_required: true
  explicit_supersede_required_for_conflicting_truth: true
  route_purity_required: true
  local_canonical_neighborhood_loading: true
  no_second_source_of_truth: true
delegation:
  read_only_research_subagents_allowed: true
  isolated_delegated_workers_require_explicit_scope: true
  parallel_write_same_worktree_forbidden: true
  delegated_context_contract_required: true
  subagent_output_is_observation_until_confirmed: true
deep_contract_docs:
  allowed: true
  required_when_touched: true
  temporary_docs_must_merge_into_history_or_stable_contract: true
  preferred_locations:
  - .aidp/contracts/
  templates_included: true
  active_contracts:
  - .aidp/contracts/signal_candidate-pipeline-core.md
  - .aidp/contracts/auth-session-boundary.md
  - .aidp/contracts/browser-assisted-websites.md
  - .aidp/contracts/content-analysis-and-gating.md
  - .aidp/contracts/content-model.md
  - .aidp/contracts/discovery-agent.md
  - .aidp/contracts/feed-ingress-adapters.md
  - .aidp/contracts/mcp-control-plane.md
  - .aidp/contracts/notifications-and-digests.md
  - .aidp/contracts/runtime-migrations-and-derived-state.md
  - .aidp/contracts/test-access-and-fixtures.md
  - .aidp/contracts/universal-selection-profiles.md
  - .aidp/contracts/universal-task-engine.md
  - .aidp/contracts/zero-shot-interest-filtering.md
setup_mode:
  enabled_until_core_is_initialized: true
  implementation_forbidden_while_uninitialized: true
  truthful_exit_requires:
    initialized_true: true
    placeholder_flag_false: true
    work_workflow_mode_not_setup: true
    setup_requirements_satisfied: true
  initialization_requires:
  - real_project_name
  - real_commands_or_explicit_proof_gaps
  - real_blueprint_content
  - real_engineering_content
  - real_work_state
  - placeholders_removed_or_replaced
proof_contours:
  fast_gate: smallest honest local proof
  structural_gate: boundary or refactor-sensitive proof
  release_gate: releasable build or promotion proof
  delivery_gate: packaging, deployment, migration, or environment delivery proof
  runtime_smoke_gate: minimal real runtime proof
engineering_defaults:
  preserve_behavior_unless_intentionally_changed: true
  keep_boundaries_clean: true
  avoid_god_objects: true
  prefer_explicit_contracts: true
  refactor_requires_proof: true
  dedicated_engineering_file_required: true
test_access:
  declared_environments_required: true
  production_like_requires_explicit_human_approval: true
  declared_identities_or_fixture_procedures_required: true
  ad_hoc_persistent_test_entities_forbidden: true
  persistent_test_artifacts_must_be_tracked: true
  cleanup_status_must_be_visible_for_stateful_testing: true
  recommended_deep_contract: .aidp/contracts/test-access-and-fixtures.md
history_sync:
  required: true
  completed_detail_must_leave_work_doc_by_end_of_sync_cycle: true
  handoff_forbidden_if_archive_sync_pending_without_note: true
  archive_index_recommended_for_long_running_projects: true
operator_safety:
  operator_safety_doc_included: true

read_only_check_policy:
  enabled: true
  command: python3 ./aidp-monitor/server.py --repo . --check
  json_command: python3 ./aidp-monitor/server.py --repo . --check --json
  strict_command: python3 ./aidp-monitor/server.py --repo . --check --strict
  read_only: true
  writes_aidp: false
  exits:
    pass: 0
    warning_strict: 1
    failure: 2
  hard_failure_examples:
  - product_writes_without_matching_active_item
  - product_writes_under_non_product_route
  - invalid_monitor_block
  - proof_passed_without_proof_ref
  - cleanup_done_or_retained_without_cleanup_ref
  - capability_proof_passed_without_capability_proof_ref
  - high_risk_without_approval

pre_write_work_state_policy:
  enabled: true
  product_source_config_test_writes_require_matching_active_item: true
  verbal_promise_not_sufficient: true
  active_item_mismatch_blocks_writes: true
  system_repair_or_docs_operator_items_do_not_cover_product_writes_by_default: true
  active_item_switch_must_be_recorded_in_work_md: true
  minimum_active_item_fields:
  - lifecycle_mode
  - work_route
  - route_phase
  - item_status
  - allowed_paths
  - risk
  - approval
  - planning_state_when_required
  - context_manifest_when_required
  - route_specific_proof
  - cleanup_expectations

work_memory_policy:
  work_md_is_live_memory_not_archive: true
  exactly_one_current_active_item_area: true
  completed_detail_moves_to_history: true
  multiple_latest_item_sections_are_repair_signal: true
  done_active_item_requires_review_archive_or_delivery_reason: true
  active_item_mismatch_blocks_writes: true

context_manifest_policy:
  enabled: true
  owner: .aidp/work.md
  refs_only: true
  no_durable_truth_in_manifest: true
  context_manifest_is_not_canon: true
  not_memory_store: true
  not_required_for_routes:
  - micro-patch
  required_for_routes:
  - capability
  recommended_or_required_for:
  - capability
  - broad_sweep
  - docs_operator_migration_or_document_intake
  - complex_delivery
  - unclear_boundary_related_bugfix
  categories:
  - implementation_refs
  - verification_refs
  - research_refs
  required_ref_fields:
  - ref
  - reason

document_intake_policy:
  enabled: true
  route: docs-operator
  repair_route_when_contradictory: audit
  document_is_observation_until_approved: true
  no_auto_canonization: true
  requires_impact_map: true
  requires_contradiction_check: true
  requires_operator_approval_before_canon_update: true
  source_paths:
  - docs/**
  - specs/**
  - requirements/**
  - designs/**
  - "*.spec.md"
  - "*.prd.md"
  allowed_statuses:
  - observed
  - candidate-prepared
  - approved
  - partially-approved
  - rejected
  - superseded
  document_types:
  - product-requirement
  - module-proposal
  - architecture-proposal
  - engineering-convention
  - verification-requirement
  - release-deployment-note
  - external-spec-artifact
  - historical-stale-note
  - human-onboarding
  - unknown
  owner_routing:
    architecture_truth: .aidp/blueprint.md
    engineering_rules: .aidp/engineering.md
    verification_rules: .aidp/verification.md
    process_or_route_notes: .aidp/routes.md
    live_work_or_capability: .aidp/work.md
    machine_facts_or_commands: .aidp/os.yaml
    completed_history: .aidp/history.md

finish_boundary_policy:
  enabled: true
  dirty_worktree_blocks_archive_without_explanation: true
  done_active_item_requires_review_archive_or_delivery_reason: true
  archived_requires_history_sync: true
  awaiting_operator_review_prefers_ready_or_blocked: true

subagent_delegation_policy:
  enabled: true
  output_is_observation_until_confirmed: true
  terminal_status_required_when_subagent_used: true
  promised_deliverable_must_be_verified: true

projection_statuses:
  - current
  - stale
  - unknown
  - invalid
proof_statuses:
  - not-required
  - pending
  - partial
  - passed
  - failed
  - unavailable
  - unknown
capability_stage_statuses:
  use_item_states: true
capability_proof_statuses:
  use_proof_statuses: true

monitoring_contract:
  schema_version: 43
  enabled: optional
  visualizer_read_only: true
  uses_global_vocabulary: true
  excluded_observation_paths:
  - aidp-monitor/**
  - aidp-monitor/
  - .aidp.backup*/**
  - .aidp.backup*
  - node_modules/**
  - .pnpm-store/**
  - .idea/**
  - .DS_Store
  - .env.dev
  - .env.prod
  - .ruff_cache/**
  - .ruff_cache/
  - "**/__pycache__/**"
  - "__pycache__/"
  - "**/.astro/**"
  - "runtime/node/apps/*/.astro/"
  - "**/dist/**"
  - "build/**"
  - "build/"
  - "runtime/node/apps/*/dist/"
  - "runtime/node/services/*/dist/"
  - "**/node_modules/**"
  - "**/node_modules/"
  - data/indices/**
  - data/indices/
  - data/models/**
  - data/models/
  - data/snapshots/**
  - data/snapshots/
  - infra/build/**
  - infra/build/
  vocabulary_refs:
    lifecycle_modes: routing.lifecycle_modes
    work_routes: routing.work_routes
    item_statuses: item_states
    risk_levels: risk_levels
    approval_statuses: approval_policy.approval_statuses
    planning_sources: planning_policy.allowed_sources
    plan_statuses: planning_policy.allowed_statuses
    blueprint_context_statuses: blueprint_boundary_policy.allowed_statuses
    proof_statuses: proof_statuses
    cleanup_statuses: cleanup_policy.allowed_statuses
    projection_statuses: projection_statuses
    capability_stage_statuses: capability_stage_statuses
    capability_proof_statuses: capability_proof_statuses
  principle:
    monitor_blocks_are_projections: true
    monitor_blocks_are_not_second_canon: true
    contradiction_requires_repair: true
    visualizer_check_mode_read_only: true
    local_monitor_cache_must_live_outside_aidp: true
    monitor_state_must_not_be_claimed_unless_checked: true
  yaml_subset:
    simple_yaml_only: true
    no_anchors: true
    stable_language_neutral_keys: true
    stable_language_neutral_enum_values: true
  allowed_block_locations:
    aidp_state: .aidp/work.md
    aidp_open_ledger: .aidp/work.md
    aidp_routes_index: .aidp/routes.md
    aidp_verification_index: .aidp/verification.md
    aidp_blueprint_index: .aidp/blueprint.md
    aidp_history_index: .aidp/history.md
  forbidden_block_locations:
  - routers
  - root docs
  - human-docs
  - CLAUDE.md
  - root AGENTS.md
  - .github/copilot-instructions.md
  monitor_hygiene:
    respect_project_excluded_paths: true
    dedupe_risks_by_id: true
    accept_capability_proof_status_alias_with_warning: true
    document_intake_awaiting_approval_requires_missing_operator_decision: true
    raw_blocks_collapsed_by_default: true
    pause_refresh_while_user_is_copying_or_editing: true
    monitor_api_proof_is_optional_operator_tool_proof: true
  monitor_claim_policy:
    do_not_claim_unread_monitor_state: true
    do_not_claim_unchecked_context_refs: true
    require_current_monitor_output_or_local_computation_before_claim: true
    unavailable_monitor_signal_must_be_reported_as_not_checked: true
  monitor_required_refs_for_capability_status:
    stage_done_requires_stage_proof_ref: true
    capability_proof_passed_requires_capability_proof_ref: true
  monitor_required_refs_for_green_status:
    proof_status_passed_requires_proof_ref: true
    blueprint_checked_requires_blueprint_ref: true
    cleanup_done_or_retained_requires_cleanup_ref: true
    approval_approved_requires_approval_ref: true
  derived_monitor_signals:
    enabled: true
    computed_by_visualizer: true
    computed_by_agent_when_obvious: true
    not_canonical_truth: true
    no_operator_filled_forms: true
    no_new_required_fields: true
    signal_source: existing AIDP projections plus git state
    ai_must_surface_high_severity_warnings: true
    ai_must_not_claim_unchecked_monitor_state: true
    warnings_are_recommendations: true
    warnings_are_not_proof: true
    warnings_do_not_create_routes: true
    signals:
      action_boundary:
        purpose: infer write/action boundary from route, risk, allowed paths and git state
      plan_sufficiency:
        purpose: infer whether planning-required route has enough accepted planning to proceed
      proof_candidates:
        purpose: suggest possible proof candidates from repeated failures, weak proof or proof gaps
  consolidation_pressure:
    enabled: true
    computed_by_visualizer: true
    computed_by_agent_when_needed: true
    not_canonical_truth: true
    operator_warning_required_on_high_or_critical: true
    agent_warning_required_on_high_or_critical: true
    no_auto_write_to_canon: true
    thresholds:
      medium: 4
      high: 9
      critical: 16
    signal_sources:
    - aidp_state
    - aidp_open_ledger
    - aidp_history_index
    - aidp_blueprint_index
    - aidp_verification_index
    - git_status
    signals:
    - parked_items
    - stale_parked_items
    - pending_proofs
    - open_blockers
    - open_risks
    - repeated_failed_attempts
    - stale_monitor_projection
    - monitor_projection_contradiction
    - blueprint_gaps
    - cleanup_pending
    - proof_missing_ref
    - capability_stalled
    - router_drift
    - changed_files_outside_allowed_paths
    - temp_generated_artifacts_without_cleanup_tracking
    - pending_document_intake
    - work_md_live_memory_drift
    - wrong_route_product_writes
    recommended_flow:
      medium: mention in handoff when relevant
      high: warn operator; recommend read-only audit memory consolidation review
      critical: warn operator before normal implementation; use repair/audit if contradiction or unsafe state exists
      after_approval: apply accepted fixes through docs-operator or repair; monitor must not auto-write owner files

adapters:
  canonical_truth: .aidp/*
  routers_are_thin: true
  route_aware: true
  monitor_blocks_forbidden_in_routers: true
