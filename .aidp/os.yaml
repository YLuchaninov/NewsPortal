# AI Dev Process OS runtime schema для SignalOps
package_version: 1.8.12
schema_version: 44
mode: Minimal
runtime_profile: compact-strict-anti-drift-signalops
initialized: true
core:
  style: compact-strict-polished-blueprint-capability-planning-anti-drift
  installed_files:
  - .aidp/AGENTS.md
  - .aidp/work.md
  - .aidp/blueprint.md
  - .aidp/engineering.md
  - .aidp/verification.md
  - .aidp/history.md
  - .aidp/os.yaml
  - .aidp/routes.md
  - .aidp/contracts/signal_candidate-pipeline-core.md
  - .aidp/contracts/auth-session-boundary.md
  - .aidp/contracts/browser-assisted-websites.md
  - .aidp/contracts/content-analysis-and-gating.md
  - .aidp/contracts/content-model.md
  - .aidp/contracts/discovery-agent.md
  - .aidp/contracts/feed-ingress-adapters.md
  - .aidp/contracts/mcp-control-plane.md
  - .aidp/contracts/notifications-and-digests.md
  - .aidp/contracts/runtime-migrations-and-derived-state.md
  - .aidp/contracts/test-access-and-fixtures.md
  - .aidp/contracts/universal-selection-profiles.md
  - .aidp/contracts/universal-task-engine.md
  - .aidp/contracts/zero-shot-interest-filtering.md
coordination:
  multi_agent_allowed: false
  single_worktree_truth_required: true
  secondary_active_item_requires_explicit_reason: true
  secondary_active_item_short_overlap_only: true
ownership:
  live_state: .aidp/work.md
  lifecycle_dispatch: .aidp/AGENTS.md
  work_route_dispatch: .aidp/routes.md
  technical_truth: .aidp/blueprint.md
  engineering_discipline: .aidp/engineering.md
  proof_policy: .aidp/verification.md
  archive: .aidp/history.md
  machine_facts: .aidp/os.yaml
planning:
  requirements_driven_capability_design: true
  capabilities_can_span_multiple_stages: true
  stages_must_be_planned_separately: true
  stage_done_is_not_capability_complete: true
  capability_completion_may_include_implementation_and_operator_closure: true
  create_next_stage_before_implementation_when_needed: true
  stage_dependency_enforcement: true
  dependency_override_requires_human_approval: true
planning_policy:
  tool_native_planning_optional: true
  aidp_native_planning_fallback_required: true
  planning_is_phase_not_route: true
  spec_artifact_is_observation_until_accepted: true
  planning_state_owner: .aidp/work.md
  allowed_sources:
  - none
  - AIDP-native
  - tool-native
  - external-spec
  - unknown
  allowed_statuses:
  - absent
  - observed
  - accepted-for-this-item
  - superseded
  - rejected
  planning_required_by_default_for_routes:
  - capability
  planning_conditionally_required_for_routes:
  - bugfix
  - sweep
  - audit
  - docs-operator
  - delivery
  planning_not_required_by_default_for_routes:
  - micro-patch
  required_conditions:
    bugfix:
    - unclear_cause
    - architecture_state_api_or_boundary_impact
    - multiple_fix_strategies
    sweep:
    - multi_file_change
    - boundary_changing_change
    - destructive_change
    - migration_like_change
    audit:
    - non_trivial_audit_scope
    docs-operator:
    - package_migration
    - runtime_core_update
    - router_or_adapter_update
    - second_canon_risk
    delivery:
    - complex_package_or_release_flow
    - multi_artifact_delivery
    - publishing_signing_or_deployment_like_behavior
project:
  name: signalops
  placeholder_values_present: false
  excluded_paths:
    - aidp-monitor/**
    - aidp-monitor/
    - .aidp.backup*/**
    - .aidp.backup*
    - node_modules/**
    - .pnpm-store/**
    - .idea/**
    - .DS_Store
    - .env.dev
    - .env.prod
    - .ruff_cache/**
    - .ruff_cache/
    - "**/__pycache__/**"
    - "__pycache__/"
    - "**/.astro/**"
    - "runtime/node/apps/*/.astro/"
    - "**/dist/**"
    - "build/**"
    - "build/"
    - "runtime/node/apps/*/dist/"
    - "runtime/node/services/*/dist/"
    - "**/node_modules/**"
    - "**/node_modules/"
    - data/indices/**
    - data/indices/
    - data/models/**
    - data/models/
    - data/snapshots/**
    - data/snapshots/
    - infra/build/**
    - infra/build/
  shape: polyglot pnpm monorepo
  language: русский runtime-core; код и продуктовые docs могут быть смешанными ru/en по существующему стилю
  package_manager: pnpm
  primary_database: PostgreSQL
  queue_transport: Redis + BullMQ
  local_runtime: Docker Compose через infra/docker/compose.yml и infra/docker/compose.dev.yml
  runtime_surfaces:
  - Astro web app runtime/node/apps/web на порту 4321
  - Astro admin app runtime/node/apps/admin на порту 4322
  - FastAPI read/debug/maintenance API runtime/python/src/signalops/api на порту 8000
  - Node fetchers service runtime/node/services/fetchers на порту 4100
  - Node outbox relay runtime/node/services/relay на порту 4000
  - Node MCP control-plane service runtime/node/services/mcp на порту 4300
  - Python worker runtime runtime/python/src/signalops/workers
  - PostgreSQL на host port 55432 в local compose
  - Redis на host port 56379 в local compose
  - nginx local front door на host port 8080
  - Mailpit SMTP/UI в dev compose на портах 1025 и 8025
  delivery_surfaces:
  - Dockerfiles в infra/docker
  - compose baseline в infra/docker/compose.yml
  - dev overlay в infra/docker/compose.dev.yml
  - nginx config в infra/nginx/default.conf
  entry_points:
  - package.json root scripts
  - pnpm-workspace.yaml workspace packages
  - database/migrations ordered SQL migrations
  - runtime/python/src/signalops/api/main.py FastAPI app
  - runtime/python/src/signalops/workers/main.py worker app
  - runtime/node/services/fetchers/src/main.ts fetchers service
  - runtime/node/services/relay/src/main.ts relay service
  - runtime/node/services/mcp/src/main.ts MCP service
  - runtime/node/apps/web/src/pages and runtime/node/apps/admin/src/pages Astro routes
capabilities:
  build: true
  lint: true
  typecheck: true
  unit_tests: true
  integration_tests: true
  smoke_tests: true
  packaging: false
  deploy: false
  database: true
  migrations: true
