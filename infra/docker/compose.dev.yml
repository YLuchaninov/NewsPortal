services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    env_file:
      - ../../.env.dev
    ports:
      - "55432:5432"

  redis:
    env_file:
      - ../../.env.dev
    ports:
      - "56379:6379"

  migrate:
    env_file:
      - ../../.env.dev

  relay:
    env_file:
      - ../../.env.dev
    ports:
      - "${RELAY_PORT:-4000}:4000"
    volumes:
      - ../../infra/scripts:/workspace/infra/scripts:ro
      - ../../infra/fixtures:/workspace/infra/fixtures:ro
      - ../../tests:/workspace/tests:ro

  fetchers:
    env_file:
      - ../../.env.dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../infra/scripts:/workspace/infra/scripts:ro
      - ../../infra/fixtures:/workspace/infra/fixtures:ro
      - ../../tests:/workspace/tests:ro

  worker:
    env_file:
      - ../../.env.dev
    volumes:
      - ../../infra/scripts:/workspace/infra/scripts:ro
      - ../../infra/fixtures:/workspace/infra/fixtures:ro
      - ../../tests:/workspace/tests:ro

  api:
    env_file:
      - ../../.env.dev
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    env_file:
      - ../../.env.dev
    ports:
      - "${WEB_PORT:-4321}:4321"

  admin:
    env_file:
      - ../../.env.dev
    ports:
      - "${ADMIN_PORT:-4322}:4322"

  mcp:
    env_file:
      - ../../.env.dev
    ports:
      - "${MCP_PORT:-4300}:4300"

  nginx:
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
