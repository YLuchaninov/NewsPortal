services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signalops}
      POSTGRES_USER: ${POSTGRES_USER:-signalops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalops}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - app_net

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/relay.Dockerfile
    command: ["node", "build/node/services/relay/cli/migrate.mjs"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signalops}
      POSTGRES_USER: ${POSTGRES_USER:-signalops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalops}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - app_net

  relay:
    build:
      context: ../..
      dockerfile: infra/docker/relay.Dockerfile
    command: ["node", "build/node/services/relay/main.mjs"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signalops}
      POSTGRES_USER: ${POSTGRES_USER:-signalops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalops}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RELAY_PORT: ${RELAY_PORT:-4000}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - app_net

  fetchers:
    build:
      context: ../..
      dockerfile: infra/docker/fetchers.Dockerfile
    command: ["node", "build/node/services/fetchers/main.mjs"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signalops}
      POSTGRES_USER: ${POSTGRES_USER:-signalops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalops}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      FETCHERS_PORT: ${FETCHERS_PORT:-4100}
      FETCHERS_POLL_INTERVAL_MS: ${FETCHERS_POLL_INTERVAL_MS:-5000}
      FETCHERS_BATCH_SIZE: ${FETCHERS_BATCH_SIZE:-100}
      FETCHERS_CONCURRENCY: ${FETCHERS_CONCURRENCY:-4}
      FETCHERS_REQUEST_TIMEOUT_MS: ${FETCHERS_REQUEST_TIMEOUT_MS:-10000}
      FETCHERS_USER_AGENT: ${FETCHERS_USER_AGENT:-SignalOpsFetchers/0.1 (+https://signalops.local)}
      FETCHERS_ACQUISITION_PRIVATE_HOST_ALLOWLIST: ${FETCHERS_ACQUISITION_PRIVATE_HOST_ALLOWLIST:-}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - app_net

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/python-app.Dockerfile
      args:
        PYTHON_APP_UID: ${PYTHON_APP_UID:-10001}
        PYTHON_APP_GID: ${PYTHON_APP_GID:-10001}
    working_dir: /workspace
    command: ["python", "-m", "signalops.workers.main"]
    volumes:
      - ../../data:/workspace/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signalops}
      POSTGRES_USER: ${POSTGRES_USER:-signalops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalops}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hash://deterministic/384}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hash}
      EMBEDDING_HASH_DIMENSIONS: ${EMBEDDING_HASH_DIMENSIONS:-384}
      MODEL_CACHE_DIR: ${MODEL_CACHE_DIR:-/workspace/data/models}
      HNSW_INDEX_ROOT: ${HNSW_INDEX_ROOT:-/workspace/data/indices}
      HNSW_SNAPSHOT_ROOT: ${HNSW_SNAPSHOT_ROOT:-/workspace/data/snapshots}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-0}
      DISCOVERY_CRON: ${DISCOVERY_CRON:-0 */6 * * *}
      DISCOVERY_BUDGET_CENTS_DEFAULT: ${DISCOVERY_BUDGET_CENTS_DEFAULT:-500}
      DISCOVERY_MAX_HYPOTHESES_PER_RUN: ${DISCOVERY_MAX_HYPOTHESES_PER_RUN:-20}
      DISCOVERY_MAX_SOURCES_DEFAULT: ${DISCOVERY_MAX_SOURCES_DEFAULT:-20}
      DISCOVERY_AUTO_APPROVE_THRESHOLD: ${DISCOVERY_AUTO_APPROVE_THRESHOLD:-}
      DISCOVERY_SEARCH_PROVIDER: ${DISCOVERY_SEARCH_PROVIDER:-ddgs}
      DISCOVERY_SEARCH_PROVIDERS: ${DISCOVERY_SEARCH_PROVIDERS:-}
      DISCOVERY_DDGS_BACKEND: ${DISCOVERY_DDGS_BACKEND:-auto}
      DISCOVERY_DDGS_REGION: ${DISCOVERY_DDGS_REGION:-us-en}
      DISCOVERY_DDGS_SAFESEARCH: ${DISCOVERY_DDGS_SAFESEARCH:-moderate}
      DISCOVERY_GEMINI_API_KEY: ${DISCOVERY_GEMINI_API_KEY:-}
      DISCOVERY_GEMINI_MODEL: ${DISCOVERY_GEMINI_MODEL:-}
      DISCOVERY_GEMINI_BASE_URL: ${DISCOVERY_GEMINI_BASE_URL:-}
      DISCOVERY_LLM_INPUT_COST_PER_MILLION_USD: ${DISCOVERY_LLM_INPUT_COST_PER_MILLION_USD:-}
      DISCOVERY_LLM_OUTPUT_COST_PER_MILLION_USD: ${DISCOVERY_LLM_OUTPUT_COST_PER_MILLION_USD:-}
      DISCOVERY_MONTHLY_BUDGET_CENTS: ${DISCOVERY_MONTHLY_BUDGET_CENTS:-0}
      FETCHERS_INTERNAL_BASE_URL: ${FETCHERS_INTERNAL_BASE_URL:-http://fetchers:4100}
      FETCHERS_INTERNAL_TIMEOUT_SECONDS: ${FETCHERS_INTERNAL_TIMEOUT_SECONDS:-30}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      EMAIL_DIGEST_SMTP_URL: ${EMAIL_DIGEST_SMTP_URL:-}
      EMAIL_DIGEST_FROM: ${EMAIL_DIGEST_FROM:-alerts@signalops.local}
      WORKER_ENABLE_USER_DIGEST_SCHEDULER: ${WORKER_ENABLE_USER_DIGEST_SCHEDULER:-1}
      WORKER_USER_DIGEST_POLL_INTERVAL_SECONDS: ${WORKER_USER_DIGEST_POLL_INTERVAL_SECONDS:-5}
      WORKER_SEQUENCE_RUNNER_CONCURRENCY: ${WORKER_SEQUENCE_RUNNER_CONCURRENCY:-4}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-mailto:alerts@signalops.local}
      LLM_REVIEW_ENABLED: ${LLM_REVIEW_ENABLED:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, psycopg, redis; psycopg.connect(f\"postgresql://{os.getenv('POSTGRES_USER')}:{os.getenv('POSTGRES_PASSWORD')}@{os.getenv('POSTGRES_HOST')}:{os.getenv('POSTGRES_PORT')}/{os.getenv('POSTGRES_DB')}\").close(); redis.Redis(host=os.getenv('REDIS_HOST'), port=int(os.getenv('REDIS_PORT'))).ping()"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - app_net

  api:
    build:
      context: ../..
      dockerfile: infra/docker/python-app.Dockerfile
      args:
        PYTHON_APP_UID: ${PYTHON_APP_UID:-10001}
        PYTHON_APP_GID: ${PYTHON_APP_GID:-10001}
    working_dir: /workspace
    command: ["uvicorn", "signalops.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ../../data:/workspace/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signalops}
      POSTGRES_USER: ${POSTGRES_USER:-signalops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalops}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MODEL_CACHE_DIR: ${MODEL_CACHE_DIR:-/workspace/data/models}
      HNSW_INDEX_ROOT: ${HNSW_INDEX_ROOT:-/workspace/data/indices}
      HNSW_SNAPSHOT_ROOT: ${HNSW_SNAPSHOT_ROOT:-/workspace/data/snapshots}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-0}
      DISCOVERY_CRON: ${DISCOVERY_CRON:-0 */6 * * *}
      DISCOVERY_BUDGET_CENTS_DEFAULT: ${DISCOVERY_BUDGET_CENTS_DEFAULT:-500}
      DISCOVERY_SEARCH_PROVIDER: ${DISCOVERY_SEARCH_PROVIDER:-ddgs}
      DISCOVERY_SEARCH_PROVIDERS: ${DISCOVERY_SEARCH_PROVIDERS:-}
      DISCOVERY_GEMINI_MODEL: ${DISCOVERY_GEMINI_MODEL:-}
      DISCOVERY_MONTHLY_BUDGET_CENTS: ${DISCOVERY_MONTHLY_BUDGET_CENTS:-0}
      SIGNALOPS_API_CONTENT_AUTH_REQUIRED: ${SIGNALOPS_API_CONTENT_AUTH_REQUIRED:-false}
      SIGNALOPS_WEB_GOOGLE_ALLOWED_DOMAIN: ${SIGNALOPS_WEB_GOOGLE_ALLOWED_DOMAIN:-}
      SIGNALOPS_WEB_TEST_AUTH_ENABLED: ${SIGNALOPS_WEB_TEST_AUTH_ENABLED:-false}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      APP_SECRET: ${APP_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health').read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - app_net

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        SIGNALOPS_APP_BASE_URL: ${SIGNALOPS_WEB_APP_BASE_URL:-http://127.0.0.1:4321/}
    command: ["node", "build/node/apps/web/server/entry.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: ${WEB_PORT:-4321}
      WEB_PORT: ${WEB_PORT:-4321}
      SIGNALOPS_APP_BASE_URL: ${SIGNALOPS_WEB_APP_BASE_URL:-http://127.0.0.1:4321/}
      SIGNALOPS_API_BASE_URL: ${SIGNALOPS_API_BASE_URL:-http://api:8000}
      SIGNALOPS_PUBLIC_API_BASE_URL: ${SIGNALOPS_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
      SIGNALOPS_COOKIE_SECURE_POLICY: ${SIGNALOPS_COOKIE_SECURE_POLICY:-auto}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      SIGNALOPS_WEB_GOOGLE_CLIENT_ID: ${SIGNALOPS_WEB_GOOGLE_CLIENT_ID:-}
      SIGNALOPS_WEB_GOOGLE_ALLOWED_DOMAIN: ${SIGNALOPS_WEB_GOOGLE_ALLOWED_DOMAIN:-}
      SIGNALOPS_WEB_TEST_AUTH_ENABLED: ${SIGNALOPS_WEB_TEST_AUTH_ENABLED:-false}
      SIGNALOPS_WEB_TEST_AUTH_EMAIL: ${SIGNALOPS_WEB_TEST_AUTH_EMAIL:-web-user@signalops.local}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      APP_SECRET: ${APP_SECRET:-}
      POSTGRES_DB: ${POSTGRES_DB:-signalops}
      POSTGRES_USER: ${POSTGRES_USER:-signalops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalops}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - app_net

  admin:
    build:
      context: ../..
      dockerfile: infra/docker/admin.Dockerfile
      args:
        SIGNALOPS_APP_BASE_URL: ${SIGNALOPS_ADMIN_APP_BASE_URL:-http://127.0.0.1:4322/}
    command: ["node", "build/node/apps/admin/server/entry.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: ${ADMIN_PORT:-4322}
      ADMIN_PORT: ${ADMIN_PORT:-4322}
      SIGNALOPS_APP_BASE_URL: ${SIGNALOPS_ADMIN_APP_BASE_URL:-http://127.0.0.1:4322/}
      SIGNALOPS_API_BASE_URL: ${SIGNALOPS_API_BASE_URL:-http://api:8000}
      SIGNALOPS_PUBLIC_API_BASE_URL: ${SIGNALOPS_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
      SIGNALOPS_COOKIE_SECURE_POLICY: ${SIGNALOPS_COOKIE_SECURE_POLICY:-auto}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-0}
      DISCOVERY_CRON: ${DISCOVERY_CRON:-0 */6 * * *}
      DISCOVERY_SEARCH_PROVIDER: ${DISCOVERY_SEARCH_PROVIDER:-ddgs}
      DISCOVERY_SEARCH_PROVIDERS: ${DISCOVERY_SEARCH_PROVIDERS:-}
      DISCOVERY_GEMINI_MODEL: ${DISCOVERY_GEMINI_MODEL:-}
      DISCOVERY_MONTHLY_BUDGET_CENTS: ${DISCOVERY_MONTHLY_BUDGET_CENTS:-0}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      APP_SECRET: ${APP_SECRET:-}
      POSTGRES_DB: ${POSTGRES_DB:-signalops}
      POSTGRES_USER: ${POSTGRES_USER:-signalops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalops}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4322/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - app_net

  mcp:
    build:
      context: ../..
      dockerfile: infra/docker/mcp.Dockerfile
    command: ["node", "build/node/services/mcp/main.mjs"]
    environment:
      MCP_PORT: ${MCP_PORT:-4300}
      SIGNALOPS_API_BASE_URL: ${SIGNALOPS_API_BASE_URL:-http://api:8000}
      SIGNALOPS_PUBLIC_API_BASE_URL: ${SIGNALOPS_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
      POSTGRES_DB: ${POSTGRES_DB:-signalops}
      POSTGRES_USER: ${POSTGRES_USER:-signalops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalops}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4300/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
      relay:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - app_net

volumes:
  pg_data:
  redis_data:

networks:
  app_net:
