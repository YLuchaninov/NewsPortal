services:
  relay:
    env_file:
      - ../../.env.prod
    restart: unless-stopped

  fetchers:
    env_file:
      - ../../.env.prod
    restart: unless-stopped

  worker:
    env_file:
      - ../../.env.prod
    restart: unless-stopped

  api:
    env_file:
      - ../../.env.prod
    restart: unless-stopped

  web:
    env_file:
      - ../../.env.prod
    restart: unless-stopped

  admin:
    env_file:
      - ../../.env.prod
    restart: unless-stopped

  mcp:
    env_file:
      - ../../.env.prod
    restart: unless-stopped

  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ../nginx/beta.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../data/tls:/etc/nginx/tls:ro
    restart: unless-stopped
