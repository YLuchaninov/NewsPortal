name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  unit-static:
    name: Unit and static gates
    runs-on: ubuntu-latest
    env:
      PYTHON_TEST_PYTHON: .venv/bin/python
      PYTHON_COVERAGE_PYTHON: .venv/bin/python
      PYTHON_LINT_PYTHON: .venv/bin/python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dev dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r infra/docker/python.requirements.txt -r infra/docker/python.dev-requirements.txt

      - name: Compliance guards
        run: pnpm check:compliance

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm unit_tests

      - name: CI smoke subset
        run: pnpm smoke:ci

      - name: Coverage report
        run: pnpm coverage:report

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/**
          if-no-files-found: warn
